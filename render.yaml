# Devnet preview only. The free PostgreSQL instance expires after 30 days.
# Reward signer can be configured after deploy as a Render secret environment variable.
services:
  - type: web
    name: haokhi-devnet
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1
    dockerContext: ./vietnam-history-gamefi
    dockerfilePath: ./vietnam-history-gamefi/deploy/devnet/backend.Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: DEVNET_DEPLOYED
        value: "true"
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLANA_PROGRAM_ID
        value: 8qUBTgX99v5EhxbAaxuqS94rgfRhnLrTgW66Gh9BvLKN
      - key: DATABASE_AUTO_CREATE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: haokhi-devnet-db
          property: connectionString
      - key: SOL_REWARD_SIGNER_ADDRESS
        value: 6RigAPgKTdEwxmRqaoMiJj6GYnkipTSwRRc9Wkw79rTv

databases:
  - name: haokhi-devnet-db
    plan: free
    region: singapore
    ipAllowList: []
